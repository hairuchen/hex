services:
  # 1. 启动 Jaeger (用来展示链路图)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686" # Jaeger 的 Web 界面端口
      - "14250:14250" # Collector 发送数据给 Jaeger 的端口
    networks:
      - hex-network-feature1

  # 2. 启动 OpenTelemetry Collector (用来收数据)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: [ "--config=/etc/otelcol/config.yaml" ]
    ports:
      - "4317:4317" # 接收探针数据的 gRPC 端口
      - "4318:4318" # 接收探针数据的 HTTP 端口
    volumes:
      - ./opentelemetry/otel-config.yaml:/etc/otelcol/config.yaml # 挂载你的配置文件
    depends_on:
      - jaeger # 确保 Jaeger 先启动
    networks:
      - hex-network-feature1

  backend:
    build:
      context: ../  # 指向项目根目录
      dockerfile: Dockerfile
    image: hex-backend-feature1:latest
    container_name: hex-backend-feature1
    ports:
      - "541:8080"
    networks:
      - hex-network-feature1
    restart: always
    environment:
      - OTEL_SERVICE_NAME=hex-backend-feature1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
    volumes:
      - ./opentelemetry/opentelemetry-javaagent.jar:/opt/otel/opentelemetry-javaagent.jar #开启日志探针
      - ./hex-backend-feature1/logs:/app/logs #日志持久化


  minio:
    image: quay.io/minio/minio:RELEASE.2025-06-13T11-33-47Z
    command: ["server", "--console-address", ":9001", "/data"]
    container_name: hex-minio-feature1
    ports:
      - "9000:9000"  # MinIO API端口
      - "9001:9001"  # MinIO控制台端口
    environment:
      MINIO_ROOT_USER: admin        # 管理员账号（可自定义）
      MINIO_ROOT_PASSWORD: admin123456  # 管理员密码（需8位以上，生产环境需强密码）
      MINIO_DEFAULT_BUCKETS: knowledge-base  # 自动创建默认桶（知识库文件存储桶）
    volumes:
      - ./minio/minio_data:/data
      - ./minio/minio_log:/var/log/minio
    restart: always
    networks:
      - hex-network-feature1
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 10s
      retries: 120
      start_period: 30s


  postgres:
    image: postgres:16-alpine  # 轻量版Alpine镜像，稳定且体积小
    container_name: hex-postgres-feature1
    ports:
      - "5432:5432"  # PostgreSQL默认端口
    environment:
      POSTGRES_USER: admin       # 数据库管理员账号
      POSTGRES_PASSWORD: admin123456  # 密码（生产环境需强密码）
      POSTGRES_DB: knowledge_base   # 自动创建的默认数据库（知识库专用）
      TZ: Asia/Shanghai             # 时区配置，避免时间戳错误
    volumes:
      - ./postgres/data:/var/lib/postgresql/data  # 数据持久化
      - ./postgres/init:/docker-entrypoint-initdb.d  # 初始化脚本目录（启动时自动执行）
    restart: always
    networks:
      - hex-network-feature1
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U kb_admin -d knowledge_base" ]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.23.0-community  # 社区版，稳定版本
    container_name: hex-neo4j-feature1
    ports:
      - "7474:7474"  # Neo4j浏览器端口（可视化操作）
      - "7687:7687"  # Bolt协议端口（Java客户端连接）
    environment:
      # 核心配置：开启认证、设置密码
      - NEO4J_AUTH=neo4j/neo4j123456
    volumes:
      - ./neo4j/data:/data               # 数据持久化
      - ./neo4j/logs:/logs               # 日志
      - ./neo4j/plugins:/plugins         # 插件目录
      - ./neo4j/import:/var/lib/neo4j/import  # 导入目录
    restart: always
    networks:
      - hex-network-feature1
    healthcheck:
      test: [ "CMD-SHELL", "cypher-shell -u neo4j -p neo4j123456 'MATCH (n) RETURN count(n) LIMIT 1'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s  # Neo4j启动较慢，延长启动等待时间

  rabbitmq:
    image: rabbitmq:3.13-management  # 带web管理界面的镜像
    container_name: hex-rabbitmq-feature1
    restart: always  # 容器退出自动重启
    networks:
      - hex-network-feature1
    ports:
      - "5672:5672"    # RabbitMQ默认端口（程序连接）
      - "15672:15672"  # Web管理界面端口（浏览器访问）
    environment:
      # 核心配置
      RABBITMQ_DEFAULT_USER: admin        # 默认用户名（可自定义，如chr）
      RABBITMQ_DEFAULT_PASS: admin123456        # 默认密码（可自定义，如123456）
      RABBITMQ_DEFAULT_VHOST: /          # 默认虚拟主机
      # 高级配置（可选，优化性能）
      RABBITMQ_MEMORY_HIGH_WATERMARK: 1024MB  # 内存上限
      RABBITMQ_DISK_FREE_LIMIT: 1GB          # 磁盘空闲下限
    volumes:
      - ./rabbitmq/rabbitmq-data:/var/lib/rabbitmq  # 持久化数据
    healthcheck: # 健康检查（确保服务启动成功）
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  hex-network-feature1:
    driver: bridge
